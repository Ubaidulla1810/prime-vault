spring:
  datasource:
    url: jdbc:mysql://mysql:3306/primevault_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
